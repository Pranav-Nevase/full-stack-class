<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animation</title>
    <style>
        .box {
            width: 100px;
            height: 100px;
            background-color: aqua;
            animation: movingBox 10s infinite
                /* animation-delay: 5s; */
                /* animation-iteration-count 5; */

        }

        /* @keyframes movingBox {
            from{
                transform:translateX(0);

            }
            to{
                transform: translateX(500px);

            }
        } */
        @keyframes movingBox {
            0% {
                position: relative;
                top: 0;
                left: 0px;

            }

            25% {
                position: relative;
                top: 0px;
                left: 500px;
                transform: rotate(90deg);
            }

            50% {
                position: relative;
                top: 300px;
                left: 500px;
                transform: rotate(180deg);
            }

            75% {
                position: relative;
                top: 300px;
                left: 0px;
                transform: rotate(270deg);
            }

            100% {
                position: relative;
                top: 0px;
                left: 0px;
                transform: rotate(360deg);
    } }

    .image img{
        animation: imageDemo 5s infinite;

    }

    @keyframes imageDemo{
        from{
            opacity: 0;
        }
        to{
            opacity: 1;
        }
    }
    .button{
        width: 20%;
        padding: 6px 14px;
        background-color: black;
        color: white;

        border: none;
        border-radius: 5px;

        transition: transform 0.5s;

    }
    .button:hover{
        animation: buttonPulse 0.5s; 

    }

    @keyframes buttonPulse{
        0%{
            transform: scale(1);

        }
        50%{
            transform: scale(1.1);

        }
        100%{
            transform: scale(1);

        }
    }


     
    </style>
</head>

<body>

    <div class="button">
        Buy Now 
    </div>
    <hr>
    <div class="image">
        <img src="../assets/images.png" alt="">
    </div>
    <div class="box">

    </div>

</body>

</html>
