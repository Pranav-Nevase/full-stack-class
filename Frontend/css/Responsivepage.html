<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
            background-color: lightcoral;

        }
        .container{
            width: 80%;
            margin: 100px auto;
            padding: 40px;
            background: white;
            text-align: center;
            border-radius: 10px;
            
        }

        /* Tablet and media reponsive  */


        @media(min-width:768px) and (max-width:850px){
            body{
                background-color: rgb(176, 230, 173);
                font-family: cursive;
            
            }
            .container{
                width: 70px;
            }
            

        }
        *{
                box-sizing: border-box;
            }
            .navbar{
                height: 70px;

                justify-content:space-between;
                background-color: black;
            }
            .logo{
                font-size: 25px;
                font-weight: bold;
            }

            .nav-items{
                display: flex;
                gap: 30px;
                font-size: 18px;
                list-style: none;
            }
            .nav-items a{
                color: white;
                text-decoration: none;
                font-size:small;
            }
            /* Mobile */
            @media(max-width:768px){
                .navbar{
                    height: auto;
                    padding: 20px;
                    flex-direction: column;
                    gap: 20px;
                }
                .nav-items{
                    flex-direction: column;
                    text-align: center;
                    gap: 15px;
                }

            }

            h1{
                text-align: center;
            }
            .courses{
                display: grid;
                grid-template-columns: repeat(4 1fr); 
                gap: 25px;   
            }

            .cards{
                background-color: wheat;
                padding: 25px;
                border-radius: 10px;
                box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            }
            .cards button{
                padding: 10px 20px ;
                border: none;m.     `

                cursor: pointer;

            } 
            /* Tablet */

            @media(max-width:992px){
                .courses{
                    
                }
            }

    </style>
 
</head>
