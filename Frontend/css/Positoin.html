<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        .box {
            position: relative;
            top: 0px;
            left: 0px;
            width: 200px;
            height: 150px;
            background-color: lightblue;
            overflow: hidden;
            z-index: -1;

        }

        img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .box1 {
            position: relative;
            top: -50px;
            left: 20px;
            width: 200px;
            height: 150px;
            background-color: lightblue;
            overflow: hidden;
            z-index: -1;
        }

        .box2 {
            position: relative;
            top: -90px;
            left: 40px;
            width: 200px;
            height: 150px;
            background-color: lightblue;
            overflow: hidden;
            z-index: -1;

        }

        .box3 {
            position: relative;
            top: -150px;
            left: 60px;
            width: 200px;
            height: 150px;
            background-color: lightblue;
            overflow: hidden;
            z-index: 1;
        }


        .parent {
            position: relative;
            width: 350px;
            ;
            height: 350px;
            background-color: aqua;
        }

        .child {
            position: absolute;
            bottom: 20px;
            right: 40px;
            width: 80px;
            height: 80px;
            background-color: bisque;

        }
    </style>
</head>

<body>
    <div class="box">
        <img src="https://picsum.photos/120/80?random=31">
    </div>
    <div class="box1">
        <img src="https://picsum.photos/120/80?random=31">

    </div>
    <div class="box2">
        <img src="https://picsum.photos/120/80?random=31">

    </div>
    <div class="box3">
        <img src="https://picsum.photos/120/80?random=31">

    </div>

    <div class="parent">
        <div class="child">

        </div>
    </div>
</body>

</html>
